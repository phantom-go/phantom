name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

# Least privilege by default; only the release job may write.
# Every third-party action is pinned to a full commit SHA (a moved tag cannot
# inject code into the release pipeline).
permissions:
  contents: read

jobs:
  test:
    name: Vet, test (race) and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Always the newest 1.26 patch release, so standard-library
          # security fixes are picked up without editing this file.
          go-version: '1.26.x'
          check-latest: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Generate test certificate
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout server.key -out server.crt -days 2 -nodes -subj "/CN=phantom"

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...

  build-release:
    name: Build and Release Phantom
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # build-provenance signing (Sigstore, keyless)
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Always the newest 1.26 patch release, so standard-library
          # security fixes are picked up without editing this file.
          go-version: '1.26.x'
          check-latest: true

      - name: Get Version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Build Matrix
        env:
          CGO_ENABLED: '0'
        run: |
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          mkdir -p dist

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}

            BINARY_SERVER="phantom-server"
            BINARY_CLIENT="phantom-client"

            if [ "$GOOS" = "windows" ]; then
              BINARY_SERVER="${BINARY_SERVER}.exe"
              BINARY_CLIENT="${BINARY_CLIENT}.exe"
            fi

            echo "Building for ${GOOS}/${GOARCH}..."

            # -trimpath: reproducible builds, no local paths in the binary.
            # CGO_ENABLED=0: static binaries, no libc dependency.
            FLAGS=(-trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${VERSION}")
            env GOOS=$GOOS GOARCH=$GOARCH go build "${FLAGS[@]}" -o "dist/${BINARY_SERVER}" ./cmd/phantom-server
            env GOOS=$GOOS GOARCH=$GOARCH go build "${FLAGS[@]}" -o "dist/${BINARY_CLIENT}" ./cmd/phantom-client

            ARCHIVE_NAME="phantom-${VERSION}-${GOOS}-${GOARCH}"
            cd dist
            if [ "$GOOS" = "windows" ]; then
              zip "../${ARCHIVE_NAME}.zip" "${BINARY_SERVER}" "${BINARY_CLIENT}"
            else
              tar -czf "../${ARCHIVE_NAME}.tar.gz" "${BINARY_SERVER}" "${BINARY_CLIENT}"
            fi
            cd ..

            rm -rf dist/*
          done

          # Checksums verified by docs/install.sh before installing.
          sha256sum phantom-*.tar.gz phantom-*.zip > SHA256SUMS

      # Signed SLSA build provenance: lets anyone verify that a binary was
      # built by this repository's CI from a specific commit, with
      #   gh attestation verify phantom-<ver>-linux-amd64.tar.gz -R phantom-go/phantom
      # (SHA256SUMS alone only proves the download was not corrupted).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            phantom-*.tar.gz
            phantom-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            phantom-*.tar.gz
            phantom-*.zip
            SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
